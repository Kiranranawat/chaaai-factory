services:
  - type: web
    name: chai-factory
    runtime: node
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
